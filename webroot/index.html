<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neobin Redirect</title>
    <style>
        body { background: #f5f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: #888; }
    </style>
</head>
<body>
    <div>正在前往 GitHub...</div>
    <script>
        const url = 'https://github.com/Tenciant450/Neobin';
        
        // 1. 尝试用最高权限强行拉起系统浏览器（跳出 WebView）
        if (typeof ksu !== 'undefined') {
            ksu.exec(`am start -a android.intent.action.VIEW -d ${url}`, "{}", function(){});
        }
        
        // 2. 兜底方案：如果 am 命令被拦，直接在当前 WebView 里跳转
        setTimeout(() => {
            window.location.replace(url);
        }, 100);
    </script>
</body>
</html>
